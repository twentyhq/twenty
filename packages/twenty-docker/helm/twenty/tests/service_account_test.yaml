suite: service account
templates:
  - templates/serviceaccount.yaml
  - templates/deployment-server.yaml
  - templates/deployment-worker.yaml
release:
  name: my-twenty
  namespace: default
tests:
  - it: does not render a ServiceAccount by default
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a ServiceAccount named after the release when enabled
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: my-twenty-twenty
      - isNull:
          path: metadata.annotations

  - it: supports a custom name
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.name: my-custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-sa

  - it: supports AWS IRSA role-arn annotation
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/twenty-role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/twenty-role

  - it: supports GCP Workload Identity annotation
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        iam.gke.io/gcp-service-account: twenty@my-project.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: twenty@my-project.iam.gserviceaccount.com

  - it: pods use the "default" service account by default
    template: templates/deployment-server.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: server pod uses the generated service account name when enabled
    template: templates/deployment-server.yaml
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-twenty-twenty

  - it: worker pod uses the generated service account name when enabled
    template: templates/deployment-worker.yaml
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-twenty-twenty

  - it: pods use an existing service account name when create is false
    template: templates/deployment-server.yaml
    set:
      serviceAccount.name: pre-existing-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: pre-existing-sa
