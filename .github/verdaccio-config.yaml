storage: /tmp/verdaccio-storage
# Published tarballs are base64-encoded in the registry request body.
max_body_size: 50mb
auth:
  htpasswd:
    file: /tmp/verdaccio-htpasswd
    max_users: 100
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  'twenty-sdk':
    access: $all
    publish: $all
  'twenty-client-sdk':
    access: $all
    publish: $all
  'twenty-ui':
    access: $all
    publish: $all
  'create-twenty-app':
    access: $all
    publish: $all
  '**':
    access: $all
    proxy: npmjs
log: { type: stdout, format: pretty, level: warn }
