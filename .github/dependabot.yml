version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      - "packages/twenty-apps/**"
    schedule:
      interval: "weekly"
    # Routine version bumps stay off (limit 0) to avoid PR churn; only security
    # advisory updates open PRs, grouped into one per entry.
    open-pull-requests-limit: 0
    versioning-strategy: "increase-if-necessary"
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
    assignees:
      - "mabdullahabaid"
    ignore:
      - dependency-name: "@graphql-yoga/nestjs"
      - dependency-name: "@nestjs/graphql"
      - dependency-name: "typeorm"
      # chokidar is pinned to v3 via a resolution: v4+ dropped native macOS
      # FSEvents and hits EMFILE on a repo this size (see #20316)
      - dependency-name: "chokidar"
  # Public Twenty apps are standalone packages (own lockfiles) excluded from the
  # root entry above, with the same security-only treatment.
  - package-ecosystem: "npm"
    directories:
      - "/packages/twenty-apps/public/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    versioning-strategy: "increase-if-necessary"
    groups:
      twenty-apps-public-security:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/packages/twenty-apps/internal/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    versioning-strategy: "increase-if-necessary"
    groups:
      twenty-apps-internal-security:
        applies-to: "security-updates"
        patterns:
          - "*"
