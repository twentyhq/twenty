name: Crowdin pre-translate
description: >
  Install the Crowdin CLI and run TM → MT → AI pre-translate for untranslated
  strings only. Each pass is non-blocking so a single engine failure cannot
  skip the download.

inputs:
  config:
    description: Path to the Crowdin CLI config file
    required: true
  token:
    description: Crowdin personal token
    required: true

runs:
  using: composite
  steps:
    - name: Install Crowdin CLI
      shell: bash
      run: npm install -g @crowdin/cli

    - name: Pre-translate untranslated strings
      shell: bash
      env:
        CROWDIN_PERSONAL_TOKEN: ${{ inputs.token }}
        CROWDIN_CONFIG: ${{ inputs.config }}
      run: |
        COMMON="--config $CROWDIN_CONFIG --token $CROWDIN_PERSONAL_TOKEN --base-url https://twenty.api.crowdin.com --translate-untranslated-only --no-progress"
        echo "=== TM pre-translate (perfect matches only) ==="
        crowdin pre-translate --method tm --translate-with-perfect-match-only $COMMON || echo "::warning::TM pre-translate failed (non-blocking)"
        echo "=== MT pre-translate (engine 2: Crowdin Translate) ==="
        crowdin pre-translate --method mt --engine-id 2 $COMMON || echo "::warning::MT pre-translate failed (non-blocking)"
        echo "=== AI pre-translate (prompt 1; covers what TM and MT could not fill) ==="
        crowdin pre-translate --method ai --ai-prompt 1 $COMMON || echo "::warning::AI pre-translate failed (non-blocking)"
