name: Install Twenty App
description: Install (or upgrade) a Twenty app on a specific workspace

inputs:
  api-url:
    description: Base URL of the target Twenty instance (e.g. https://my.twenty.instance)
    required: true
  api-key:
    description: API key or access token for the target workspace
    required: true
  cli-version:
    description: Exact Twenty CLI version, ignored when TWENTY_CLI points to a local build
    required: false
    default: '2.49.0'
  app-path:
    description: Path to the app directory (relative to repo root). Defaults to repo root.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: '${{ inputs.app-path }}/.nvmrc'
        cache: yarn
        cache-dependency-path: '${{ inputs.app-path }}/yarn.lock'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app-path }}
      run: yarn install --immutable

    - name: Install Twenty CLI
      if: env.TWENTY_CLI == ''
      shell: bash
      env:
        TWENTY_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        if [ -z "$TWENTY_CLI_VERSION" ]; then
          echo "::error::Set cli-version to an exact released Twenty CLI version, or set TWENTY_CLI to a local build."
          exit 1
        fi
        npm install -g "twenty@$TWENTY_CLI_VERSION"

    - name: Install
      shell: bash
      working-directory: ${{ inputs.app-path }}
      env:
        TWENTY_API_URL: ${{ inputs.api-url }}
        TWENTY_API_KEY: ${{ inputs.api-key }}
      run: |
        if [ -n "${TWENTY_CLI:-}" ]; then
          node "$TWENTY_CLI" app install
        else
          twenty app install
        fi
