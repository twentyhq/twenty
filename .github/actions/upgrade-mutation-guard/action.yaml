name: Upgrade Mutation Guard
description: >
  Validates that added/modified upgrade commands stay in the current version
  directory (frozen as well once its tag exists) and keep timestamps real and
  append-only, diffed against a given base. Previous and next version
  directories each have their own label bypass. Shared by the PR-level guard
  (base = PR base) and the merge-queue guard (base = merge candidate's base,
  i.e. the current tip of main).

inputs:
  base_sha:
    description: Commit to diff the working tree against.
    required: true
  allow_previous_version_mutation:
    description: Allow changes to previous (or released) version directories (PR label bypass).
    required: false
    default: 'false'
  allow_next_version_mutation:
    description: Allow changes to next version directories (PR label bypass).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Fetch base commit
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
      run: |
        set -euo pipefail
        if [ -z "$BASE_SHA" ]; then
          echo "::error::base_sha input is empty"
          exit 1
        fi
        git fetch --no-tags --depth=1 origin "$BASE_SHA"

    - name: Check upgrade version commands are in current version only
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        COMMANDS_ROOT: packages/twenty-server/src/database/commands/upgrade-version-command
        ALLOW_PREVIOUS_VERSION_MUTATION: ${{ inputs.allow_previous_version_mutation }}
        ALLOW_NEXT_VERSION_MUTATION: ${{ inputs.allow_next_version_mutation }}
      run: |
        set -euo pipefail
        VERSION_CONSTANT_FILE="packages/twenty-server/src/engine/core-modules/upgrade/constants/twenty-current-version.constant.ts"

        CURRENT_VERSION=$(sed -n "s/.*TWENTY_CURRENT_VERSION = '\([0-9.]*\)'.*/\1/p" "$VERSION_CONSTANT_FILE")

        if [ -z "$CURRENT_VERSION" ]; then
          echo "::error::Could not extract TWENTY_CURRENT_VERSION from $VERSION_CONSTANT_FILE"
          exit 1
        fi

        CURRENT_DIR=$(echo "$CURRENT_VERSION" | sed -E 's/^([0-9]+)\.([0-9]+)\..*/\1-\2/')

        echo "Current version: $CURRENT_VERSION (directory: $CURRENT_DIR)"

        DIFF=$(git diff --name-status --find-renames "$BASE_SHA" HEAD -- "$COMMANDS_ROOT")

        ADDED_FILES=$(echo "$DIFF" | awk '$1 == "A" { print $2 } $1 ~ /^[RC]/ { print $3 }')
        MODIFIED_FILES=$(echo "$DIFF" | awk '$1 == "M" { print $2 }')
        REMOVED_FILES=$(echo "$DIFF" | awk '$1 == "D" { print $2 } $1 ~ /^R/ { print $2 }')

        # Between the tag push and the version bump PR, TWENTY_CURRENT_VERSION
        # still names the released version. Once its tag exists, its directory
        # is a previous version like any other: the tag already shipped it.
        # The lookup only runs when the change touches that directory, and a
        # lookup that cannot answer fails the check instead of passing it.
        IS_CURRENT_VERSION_RELEASED=false

        if echo "$ADDED_FILES $MODIFIED_FILES $REMOVED_FILES" | grep -qF "upgrade-version-command/${CURRENT_DIR}/"; then
          LS_REMOTE_STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/twenty/v${CURRENT_VERSION}" >/dev/null || LS_REMOTE_STATUS=$?

          case "$LS_REMOTE_STATUS" in
            0)
              IS_CURRENT_VERSION_RELEASED=true
              echo "twenty/v${CURRENT_VERSION} is already tagged: ${CURRENT_DIR} is frozen until the version bump lands."
              ;;
            2)
              echo "twenty/v${CURRENT_VERSION} is not tagged yet: ${CURRENT_DIR} is writable."
              ;;
            *)
              echo "::error::Could not determine whether twenty/v${CURRENT_VERSION} is tagged (git ls-remote exited ${LS_REMOTE_STATUS}). Re-run the job."
              exit 1
              ;;
          esac
        fi

        is_next_version_dir() {
          [ "$1" != "$CURRENT_DIR" ] && [ "$(printf '%s\n%s\n' "$1" "$CURRENT_DIR" | sort -V | tail -n 1)" = "$1" ]
        }

        PREVIOUS_VERSION_OFFENDERS=""
        NEXT_VERSION_OFFENDERS=""

        check_files() {
          local change="$1"
          shift
          for file in "$@"; do
            VERSION_DIR=$(echo "$file" | sed -n 's|.*upgrade-version-command/\([0-9]*-[0-9]*\)/.*|\1|p')

            if [ -z "$VERSION_DIR" ]; then
              continue
            fi

            if is_next_version_dir "$VERSION_DIR"; then
              NEXT_VERSION_OFFENDERS="$NEXT_VERSION_OFFENDERS\n  - $file ($change, version directory: $VERSION_DIR)"
            elif [ "$VERSION_DIR" != "$CURRENT_DIR" ] || [ "$IS_CURRENT_VERSION_RELEASED" = "true" ]; then
              PREVIOUS_VERSION_OFFENDERS="$PREVIOUS_VERSION_OFFENDERS\n  - $file ($change, version directory: $VERSION_DIR)"
            fi
          done
        }

        check_files "added" $ADDED_FILES
        check_files "modified" $MODIFIED_FILES
        check_files "removed" $REMOVED_FILES

        FAILED=false

        if [ -n "$PREVIOUS_VERSION_OFFENDERS" ] && [ "$ALLOW_PREVIOUS_VERSION_MUTATION" != "true" ]; then
          FAILED=true
          if [ "$IS_CURRENT_VERSION_RELEASED" = "true" ]; then
            echo "This change touches upgrade command files of a released version: twenty/v${CURRENT_VERSION} is already tagged, so ${CURRENT_DIR} is frozen."
          else
            echo "This change touches upgrade command files of previous version directories (current: $CURRENT_DIR / $CURRENT_VERSION)."
          fi
          echo -e "$PREVIOUS_VERSION_OFFENDERS"
          echo ""
          echo "If this is intentional, add the label 'ci:allow-previous-version-upgrade-mutation' to the PR and re-run CI."
          if [ "$IS_CURRENT_VERSION_RELEASED" = "true" ]; then
            echo "Otherwise, wait for the version bump PR to land, then regenerate your command under the next version."
          else
            echo "Otherwise, move your changes to the current version directory ($CURRENT_DIR)."
          fi
          echo ""
        fi

        if [ -n "$NEXT_VERSION_OFFENDERS" ] && [ "$ALLOW_NEXT_VERSION_MUTATION" != "true" ]; then
          FAILED=true
          echo "This change touches upgrade command files of next version directories (current: $CURRENT_DIR / $CURRENT_VERSION)."
          echo "These commands stay dormant until their version becomes current."
          echo -e "$NEXT_VERSION_OFFENDERS"
          echo ""
          echo "If this is intentional (e.g. a deferred drop), add the label 'ci:allow-next-version-upgrade-mutation' to the PR and re-run CI."
          echo "Otherwise, move your changes to the current version directory ($CURRENT_DIR)."
          echo ""
        fi

        if [ "$FAILED" = "true" ]; then
          echo "::error::Upgrade commands were added, modified or removed outside the current version directory."
          exit 1
        fi

    - name: Check upgrade command timestamps are real and keep the sequence append-only
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        COMMANDS_ROOT: packages/twenty-server/src/database/commands/upgrade-version-command
      run: |
        set -euo pipefail
        extract_ts() {
          basename "$1" | sed -n -E 's/.*-(instance-command-(fast|slow)|workspace-command)-([0-9]{13})-.*/\3/p'
        }

        DIFF=$(git diff --name-status --find-renames "$BASE_SHA" HEAD -- "$COMMANDS_ROOT")

        NEW_FILES=$(echo "$DIFF" | awk '$1 == "A" { print $2 } $1 ~ /^[RC]/ { print $3 }')
        GONE_FILES=$(echo "$DIFF" | awk '$1 == "D" { print $2 } $1 ~ /^R/ { print $2 }')

        NOW_MS=$(($(date +%s) * 1000))
        MIN_TS=$((NOW_MS - 60 * 24 * 3600 * 1000))
        MAX_TS=$((NOW_MS + 2 * 24 * 3600 * 1000))

        FAILED=""

        for file in $NEW_FILES; do
          case "$file" in *.spec.ts) continue ;; esac

          TS=$(extract_ts "$file")

          if [ -z "$TS" ]; then
            continue
          fi

          if [ "$TS" -lt "$MIN_TS" ] || [ "$TS" -gt "$MAX_TS" ]; then
            FAILED="$FAILED\n  - $file (timestamp $TS is outside [now - 60 days, now + 2 days])"
            continue
          fi

          VERSION_DIR=$(dirname "$file")

          MAX_BASE_TS=0
          for base_file in $(git ls-tree -r --name-only "$BASE_SHA" -- "$VERSION_DIR"); do
            case "$base_file" in *.spec.ts) continue ;; esac

            if echo "$GONE_FILES" | grep -qxF "$base_file"; then
              continue
            fi

            BASE_TS=$(extract_ts "$base_file")

            if [ -n "$BASE_TS" ] && [ "$BASE_TS" -gt "$MAX_BASE_TS" ]; then
              MAX_BASE_TS=$BASE_TS
            fi
          done

          if [ "$MAX_BASE_TS" -gt 0 ] && [ "$TS" -le "$MAX_BASE_TS" ]; then
            FAILED="$FAILED\n  - $file (timestamp $TS <= existing max $MAX_BASE_TS)"
          fi
        done

        if [ -n "$FAILED" ]; then
          echo "Upgrade command timestamps must be the real epoch millis of when the command"
          echo "is authored (within 60 days before / 2 days after now), and strictly greater"
          echo "than every existing command in the same version directory."
          echo ""
          echo "The upgrade cursor tracks a single last-applied position: a command that sorts"
          echo "before already-applied commands moves the cursor backwards when it runs,"
          echo "re-hiding columns gated by @WasIntroducedInUpgrade on instances that already"
          echo "applied them. Fabricated future timestamps poison the sequence for every"
          echo "command added after them."
          echo ""
          echo "If the blocking existing max is itself a fabricated future timestamp, re-slot"
          echo "that command to its real merge epoch (rename the file and the timestamp in the"
          echo "decorator/constant, and make its up() idempotent since it will re-run under"
          echo "the new name) instead of inflating the new command's timestamp."
          echo -e "$FAILED"
          echo "::error::Upgrade command timestamps must be real (close to now) and append-only within their version directory."
          exit 1
        fi
