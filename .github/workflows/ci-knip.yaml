name: CI Knip

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  knip:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Run knip
        run: npx nx knip twenty -- --no-exit-code
