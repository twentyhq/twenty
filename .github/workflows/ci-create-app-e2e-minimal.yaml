name: CI Create App E2E minimal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/create-twenty-app/**
        .github/workflows/ci-create-app-e2e-minimal.yaml
  create-app-e2e-minimal:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build retired package
        run: npx nx build create-twenty-app
      - name: Check migration instructions
        shell: bash
        run: |
          test_directory=$(mktemp -d)
          cd "$test_directory"
          set +e
          output=$(node "$GITHUB_WORKSPACE/packages/create-twenty-app/dist/cli.cjs" my-app 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test ! -e my-app
          echo "$output"
          [[ "$output" == *"twenty app init my-app"* ]]
  ci-create-app-e2e-minimal-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, create-app-e2e-minimal]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
