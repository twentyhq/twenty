name: Build, Push and Deploy Twenty CRM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    timeout-minutes: 5
    runs-on:
      - self-hosted
      - k3s

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Registry
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and push the image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          push: true
          tags: |
            kyotech/twenty-custom:latest
            kyotech/twenty-custom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 4.1 prepare kubectl command
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      # 5. Update the deployment directly
      - name: Deploy to k3s
        run: |
          kubectl set image deployment/twenty-crm \
            twenty-crm=kyotech/twenty-custom:${{ github.sha }} \
            -n default

          kubectl rollout status deployment/twenty-crm \
            -n default \
            --timeout=180s
