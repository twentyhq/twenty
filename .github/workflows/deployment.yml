name: Build, Push and Deploy Twenty CRM

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: 100.85.153.173:5000
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          push: true
          tags: |
            100.85.153.173:5000/twenty-custom:latest
            100.85.153.173:5000/twenty-custom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    needs: build
    runs-on:
      - self-hosted
      - k3s
    timeout-minutes: 10

    steps:
      - name: Deploy
        run: |
          kubectl set image deployment/twenty-crm \
            twenty-crm=100.85.153.173:5000/twenty-custom:${{ github.sha }} \
            -n default

          kubectl rollout status deployment/twenty-crm \
            -n default \
            --timeout=180s
