name: Build, Push and Deploy Twenty CRM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Quellcode aus dem Repository herunterladen
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Docker Buildx einrichten
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Bei der Docker Registry anmelden
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Image bauen und mit Commit-SHA taggen
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          push: true
          # HIER NEU: Wir taggen mit 'latest' UND dem eindeutigen Hash
          tags: |
            kyotech/twenty-custom:latest
            kyotech/twenty-custom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. SSH-Verbindung aufbauen und Deployment gezielt updaten
      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Setzt das exakt neu gebaute Image im Deployment
            # Syntax: kubectl set image deployment/<deployment-name> <container-name>=<image>
            kubectl set image deployment/twenty-crm twenty-crm=kyotech/twenty-custom:${{ github.sha }}
            
            # Optional, aber empfohlen: Die Pipeline wartet hier, bis der Rollout erfolgreich war.
            # Schlägt der Health-Check (Readiness Probe) fehl, wird die Pipeline rot.
            kubectl rollout status deployment/twenty-crm --timeout=180s
