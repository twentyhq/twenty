name: Build, Push and Deploy Twenty CRM

# Die Pipeline startet automatisch, wenn du Code in den "main" Branch pushst.
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Quellcode aus dem Repository herunterladen
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Docker Buildx einrichten (für modernes und schnelles Bauen)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Bei der Docker Registry anmelden (z. B. Docker Hub)
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Image bauen und pushen
      # GitHub Actions übernimmt hier automatisch die .dockerignore
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          push: true
          tags: kyotech/twenty-custom:latest
          # Optional: Verhindert, dass der Cache der GitHub-Runner überläuft
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. SSH-Verbindung aufbauen und Deployment restarten
      - name: Restart k3s Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Sagt Kubernetes, dass es das Image neu ziehen und die Pods nacheinander neu starten soll
            kubectl rollout restart deployment twenty-crm
