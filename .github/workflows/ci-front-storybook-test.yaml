name: CI Front Storybook Test

on:
  workflow_call:
    inputs:
      scope:
        type: string
        required: true
        description: 'Storybook scope to test: modules, pages or performance'
      shard:
        type: number
        required: true
      shard-count:
        type: number
        required: true
      runner:
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  storybook-test:
    timeout-minutes: 30
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      REACT_APP_SERVER_BASE_URL: http://localhost:3000
      STORYBOOK_URL: http://localhost:6006
    steps:
      - name: Fetch local actions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Cache storybook vitest dependency optimizer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/twenty-front/node_modules/.cache/storybook
          key: v4-storybook-vitest-deps-twenty-front-${{ inputs.scope }}-${{ hashFiles('yarn.lock', 'packages/twenty-front/vite.config.ts', 'packages/twenty-front/vitest.config.ts', 'packages/twenty-front/.storybook/main.ts') }}
      - name: Restore Nx cache
        id: restore-nx-cache
        uses: ./.github/actions/restore-nx-cache
        with:
          key: storybook-test-dependencies
      - name: Build dependencies
        run: |
          npx nx build twenty-shared
          npx nx build twenty-ui
          npx nx build twenty-front-component-renderer
      - name: Save Nx cache
        if: inputs.scope == 'modules' && inputs.shard == 1
        uses: ./.github/actions/save-nx-cache
        with:
          key: ${{ steps.restore-nx-cache.outputs.cache-primary-key }}
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: v4-playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd packages/twenty-front
          npx playwright install chromium
      - name: Front / Write .env
        run: npx nx reset:env twenty-front
      - name: Run storybook tests
        run: npx nx storybook:test:no-coverage twenty-front --configuration=${{ inputs.scope }} --shard=${{ inputs.shard }}/${{ inputs.shard-count }}
      - name: Upload screenshots for visual regression
        if: always() && !cancelled() && inputs.scope != 'performance'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argos-screenshots-twenty-front-${{ inputs.scope }}-${{ inputs.shard }}
          path: packages/twenty-front/screenshots
          retention-days: 1
          overwrite: true
