name: 'Push website translations to Crowdin'

permissions:
  contents: write
  pull-requests: read

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['main']
    paths:
      - 'packages/twenty-website/**'
      - '!packages/twenty-website/src/locales/**'
      - '.github/crowdin-website.yml'
      - '.github/workflows/website-i18n-push.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  extract_website_translations:
    name: Extract and upload website translations
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push_changes.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ github.token }}
          ref: main
          # Merging main into the i18n branch needs their shared history
          fetch-depth: 0
          filter: blob:none

      - name: Setup website i18n branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@twenty.com'
          # The branch only holds regenerable output, so restart it from main when
          # there is no open PR to keep or when keeping it would conflict with main
          if [ "$(gh pr list --head i18n-website --base main --state open --json number --jq length)" = 0 ]; then
            git checkout -B i18n-website origin/main
          else
            git checkout -B i18n-website origin/i18n-website
            git merge --no-edit origin/main || { git merge --abort && git checkout -B i18n-website origin/main; }
          fi

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Build dependencies
        run: npx nx build twenty-shared

      - name: Extract website translations
        run: npx nx run twenty-website:lingui:extract

      - name: Check and commit extracted files
        id: check_extract_changes
        run: |
          git add packages/twenty-website/src/locales
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore: extract website translations"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile website translations
        run: npx nx run twenty-website:lingui:compile

      - name: Check and commit compiled files
        id: check_compile_changes
        run: |
          git add packages/twenty-website/src/locales/generated
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore: compile website translations"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes and create remote branch if needed
        id: push_changes
        if: steps.check_extract_changes.outputs.changes_detected == 'true' || steps.check_compile_changes.outputs.changes_detected == 'true'
        run: git push --force-with-lease origin HEAD:i18n-website

      - name: Upload missing website translations
        if: steps.check_extract_changes.outputs.changes_detected == 'true'
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2
        with:
          upload_sources: true
          upload_sources_args: '--delete-obsolete'
          upload_translations: true
          download_translations: false
          localization_branch_name: i18n-website
          base_url: 'https://twenty.api.crowdin.com'
          config: '.github/crowdin-website.yml'
        env:
          # Website translations project
          CROWDIN_PROJECT_ID: '4'
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  open_pull_request:
    name: Open website translations pull request
    needs: extract_website_translations
    if: needs.extract_website_translations.outputs.pushed == 'true'
    permissions: {}
    uses: ./.github/workflows/i18n-open-pull-request.yaml
    with:
      branch: i18n-website
      title: 'i18n - website translations'
    secrets:
      TWENTY_PR_PRIVATE_KEY: ${{ secrets.TWENTY_PR_PRIVATE_KEY }}
      TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY: ${{ secrets.TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
