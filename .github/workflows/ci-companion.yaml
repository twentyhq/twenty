name: CI Desktop

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        package.json
        yarn.lock
        packages/twenty-companion/**
        packages/twenty-ui/**
        packages/twenty-front/**
        packages/twenty-oxlint-rules/**
        packages/twenty-shared/**
        .github/workflows/ci-companion.yaml
  desktop:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/yarn-install
      - name: Typecheck
        run: yarn workspace @twentyhq/companion typecheck
      - name: Lingui strings
        run: yarn workspace @twentyhq/companion lint:unlocalized-strings
      - name: Test
        run: yarn workspace @twentyhq/companion test
      - name: Build
        run: yarn workspace @twentyhq/companion build
  ci-companion-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, desktop]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
