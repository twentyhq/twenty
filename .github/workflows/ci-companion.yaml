name: CI Desktop

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/twenty-companion/**
        packages/twenty-ui/**
        packages/twenty-front/**
        packages/twenty-oxlint-rules/**
        packages/twenty-shared/**
        package.json
        yarn.lock
        .github/workflows/ci-companion.yaml

  # Concurrency sits on the gated job so a run with no relevant change never
  # replaces a pending relevant one on main.
  desktop:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    concurrency:
      group: ci-companion-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/yarn-install
      - name: Build Twenty UI
        run: yarn nx build twenty-ui
      - name: Typecheck
        run: yarn workspace @twentyhq/companion typecheck
      - name: Lingui strings
        run: yarn workspace @twentyhq/companion lint:unlocalized-strings
      - name: Test
        run: yarn workspace @twentyhq/companion test
      - name: Build
        run: yarn workspace @twentyhq/companion build
