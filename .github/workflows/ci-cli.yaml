name: CI CLI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/twenty-cli/**
        packages/create-twenty-app/**
        packages/twenty-sdk/**
        packages/twenty-client-sdk/**
        packages/twenty-shared/**
        packages/twenty-ui/**
        packages/twenty-oxlint-rules/**
        package.json
        yarn.lock
        nx.json
        tsconfig.base.json
        .yarnrc.yml
        .github/actions/yarn-install/**
        .github/workflows/changed-files.yaml
        .github/workflows/ci-cli.yaml
  cli-test:
    needs: changed-files-check
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'merge_group' || needs.changed-files-check.outputs.any_changed == 'true')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build SDK parity fixtures and CLI
        run: npx nx run-many --target=build --projects=twenty-sdk,twenty-cli --parallel=2
      - name: Lint
        run: npx nx lint twenty-cli
      - name: Typecheck
        run: npx tsgo -p packages/twenty-cli/tsconfig.json --noEmit
      - name: Test
        run: npx vitest run --maxWorkers=2
        working-directory: packages/twenty-cli
  ci-cli-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, cli-test]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
