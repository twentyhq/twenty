name: CI Server Integration Test Timings

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  server-integration-test:
    uses: ./.github/workflows/ci-server-integration-test.yaml
    with:
      record-timings: true

  save-integration-test-timings:
    needs: server-integration-test
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Download shard timings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: integration-test-timings-*
          merge-multiple: true
          path: shard-timings
      - name: Restore previous timings
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (restore)
        with:
          key: integration-test-timings-${{ github.run_id }}
          restore-keys: integration-test-timings-
          path: .cache/integration-test-timings
      # Overlays on the previous timings so specs that failed tonight keep their last known duration.
      - name: Merge shard timings into previous timings
        run: |
          mkdir -p .cache/integration-test-timings
          timings=.cache/integration-test-timings/timings.json
          [ -f "$timings" ] || echo '{}' > "$timings"
          jq -s 'map(with_entries(select(.value | type == "number" and . > 0))) | add' \
            "$timings" shard-timings/*.json > merged-timings.json
          mv merged-timings.json "$timings"
          echo "$(jq 'length' "$timings") spec timings saved"
      - name: Save timings
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (save)
        with:
          key: integration-test-timings-${{ github.run_id }}
          path: .cache/integration-test-timings
