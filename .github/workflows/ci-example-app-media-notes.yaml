name: CI Example App Media Notes

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/twenty-apps/examples/media-notes/**
        packages/twenty-sdk/**
        packages/twenty-front/src/modules/front-components/**
        packages/twenty-front-component-renderer/**
        packages/twenty-shared/**
        packages/twenty-server/src/engine/core-modules/file/**
        !packages/twenty-sdk/package.json
        !packages/twenty-shared/package.json

  example-app-media-notes:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest-8-cores
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      TWENTY_API_URL: http://localhost:3000
      TWENTY_API_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..HMGqCsVlOAPVUBhKSGlD1X86VoHKt4LIUtET3CGIdik
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Build SDK packages
        run: npx nx build twenty-sdk

      # Cheap checks first: a broken app never gets past publish, so failing
      # here avoids paying for the server + browser boot below.
      #
      # The example app is outside the root workspaces list, so tsc and oxlint
      # come from the root node_modules that yarn hoists them into. --no-install
      # makes that dependency explicit: if hoisting ever stops providing them,
      # this fails loudly instead of npx silently fetching an unrelated registry
      # package and exiting 0 on a check that never ran.
      - name: Typecheck and lint media-notes app
        working-directory: packages/twenty-apps/examples/media-notes
        run: |
          npx --no-install tsc --noEmit -p tsconfig.json
          npx --no-install oxlint -c .oxlintrc.json .

      - name: Setup environment files
        run: |
          npx nx reset:env twenty-front
          npx nx reset:env:e2e-testing-server twenty-server

      # The shipped image compiles catalogs before building the front, so the
      # generated ones are never committed. Without this the e2e would run
      # against a build that shows message ids where the docker image shows text.
      - name: Compile translations
        run: |
          npx nx run twenty-front:lingui:extract
          npx nx run twenty-front:lingui:compile

      - name: Build frontend
        run: NODE_ENV=production npx nx build twenty-front

      - name: Build server
        run: npx nx build twenty-server

      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c 'CREATE DATABASE "default";'
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c 'CREATE DATABASE "test";'

      - name: Setup database
        run: npx nx run twenty-server:database:reset

      # Cookie sessions are credentialed, so the front only authenticates from
      # the API's own origin — workspace subdomains included, which the login
      # flow lands on. Serving the build from the server keeps every request
      # same-origin, the same way the twenty docker image ships the front.
      - name: Serve the frontend from the server
        run: cp -r packages/twenty-front/build packages/twenty-server/dist/front

      # start:ci runs nest start; the watch-mode target would rimraf dist and
      # delete the front we just copied.
      - name: Start server
        run: nohup npx nx start:ci twenty-server &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000/healthz --timeout 120000 --interval 1000

      - name: Configure remote for SDK CLI
        run: |
          mkdir -p ~/.twenty
          cat > ~/.twenty/config.json <<EOF
          {
            "version": 1,
            "remotes": {
              "target": {
                "apiUrl": "${TWENTY_API_URL}",
                "apiKey": "${TWENTY_API_KEY}",
                "accessToken": "${TWENTY_API_KEY}"
              }
            },
            "defaultRemote": "target"
          }
          EOF

      - name: Publish media-notes app
        working-directory: packages/twenty-apps/examples/media-notes
        run: node ${{ github.workspace }}/packages/twenty-sdk/dist/cli.cjs app:publish --private --remote target

      - name: Install media-notes app
        working-directory: packages/twenty-apps/examples/media-notes
        run: node ${{ github.workspace }}/packages/twenty-sdk/dist/cli.cjs app:install --remote target

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run media capture e2e test
        working-directory: packages/twenty-apps/examples/media-notes
        run: npx playwright test --project=setup --project=chromium
        env:
          FRONT_BASE_URL: http://localhost:3000

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media-notes-e2e-screenshots
          path: packages/twenty-apps/examples/media-notes/e2e/.results/
          retention-days: 7

  ci-example-app-media-notes-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, example-app-media-notes]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
