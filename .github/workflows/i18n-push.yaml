name: 'Push translations to Crowdin'

permissions:
  contents: write
  pull-requests: read

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['main']
    paths-ignore:
      - 'packages/twenty-front/src/locales/**'
      - 'packages/twenty-emails/src/locales/**'
      - 'packages/twenty-server/src/engine/core-modules/i18n/locales/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  extract_translations:
    name: Extract and upload translations
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push_changes.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ github.token }}
          ref: main
          # Merging main into the i18n branch needs their shared history
          fetch-depth: 0
          filter: blob:none

      - name: Setup i18n branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@twenty.com'
          # The branch only holds regenerable output, so restart it from main when
          # there is no open PR to keep or when keeping it would conflict with main
          if [ "$(gh pr list --head i18n --base main --state open --json number --jq length)" = 0 ]; then
            git checkout -B i18n origin/main
          else
            git checkout -B i18n origin/i18n
            git merge --no-edit origin/main || { git merge --abort && git checkout -B i18n origin/main; }
          fi

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Build dependencies
        run: npx nx build twenty-shared

      - name: Extract translations
        run: |
          npx nx run twenty-server:lingui:extract
          npx nx run twenty-emails:lingui:extract
          npx nx run twenty-front:lingui:extract

      - name: Check and commit extracted files
        id: check_extract_changes
        run: |
          git add .
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore: extract translations"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile translations
        run: |
          npx nx run twenty-server:lingui:compile
          npx nx run twenty-emails:lingui:compile
          npx nx run twenty-front:lingui:compile

      - name: Check and commit compiled files
        id: check_compile_changes
        run: |
          git add .
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore: compile translations"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes and create remote branch if needed
        id: push_changes
        if: steps.check_extract_changes.outputs.changes_detected == 'true' || steps.check_compile_changes.outputs.changes_detected == 'true'
        run: git push --force-with-lease origin HEAD:i18n

      - name: Upload missing translations
        if: steps.check_extract_changes.outputs.changes_detected == 'true'
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2
        with:
          upload_sources: true
          upload_sources_args: '--delete-obsolete'
          upload_translations: true
          download_translations: false
          localization_branch_name: i18n
          base_url: 'https://twenty.api.crowdin.com'
          config: '.github/crowdin-app.yml'
        env:
          # App translations project
          CROWDIN_PROJECT_ID: '1'
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  open_pull_request:
    name: Open translations pull request
    needs: extract_translations
    if: needs.extract_translations.outputs.pushed == 'true'
    permissions: {}
    uses: ./.github/workflows/i18n-open-pull-request.yaml
    with:
      branch: i18n
      title: 'i18n - translations'
    secrets:
      TWENTY_PR_PRIVATE_KEY: ${{ secrets.TWENTY_PR_PRIVATE_KEY }}
      TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY: ${{ secrets.TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
