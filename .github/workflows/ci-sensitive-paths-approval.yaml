name: Sensitive Paths Approval

# Requires an approval from a maintainer when a PR touches CI, supply-chain or
# agent configuration, without requesting anyone's review. Reports the
# "Sensitive paths approval" commit status, which the main ruleset requires.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ['PR Review Relay']
    types: [completed]
  merge_group:

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: sensitive-paths-approval-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.merge_group.head_sha }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const STATUS_CONTEXT = 'Sensitive paths approval';
            const SENSITIVE_PATH_PREFIXES = ['.github/', '.claude/'];
            const SENSITIVE_FILES = ['.yarnrc.yml', '.mcp.json', 'CLAUDE.md'];
            const APPROVERS = [
              'charlesBochet',
              'Weiko',
              'prastoin',
              'bosiraphael',
              'etiennejouan',
              'ijreilly',
              'martmull',
              'thomtrp',
            ].map((login) => login.toLowerCase());

            const { owner, repo } = context.repo;

            const setStatus = (sha, state, description) =>
              github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: STATUS_CONTEXT,
                description,
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });

            // A PR only enters the queue once its own status is green.
            if (context.eventName === 'merge_group') {
              await setStatus(context.payload.merge_group.head_sha, 'success', 'Checked on the pull request');
              return;
            }

            let pullNumber = context.payload.pull_request?.number;

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              pullNumber = run.pull_requests?.[0]?.number;

              // pull_requests is empty for fork PRs
              if (!pullNumber) {
                const { data: pulls } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head: `${run.head_repository.owner.login}:${run.head_branch}`,
                  per_page: 1,
                });
                pullNumber = pulls[0]?.number;
              }
            }

            if (!pullNumber) {
              core.info('No open pull request found for this event');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });

            const isSensitive = (path) =>
              SENSITIVE_FILES.includes(path) ||
              SENSITIVE_PATH_PREFIXES.some((prefix) => path.startsWith(prefix));

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const sensitiveFiles = files
              .flatMap((file) => [file.filename, file.previous_filename])
              .filter((path) => path && isSensitive(path));

            if (sensitiveFiles.length === 0) {
              await setStatus(pull.head.sha, 'success', 'No sensitive paths changed');
              return;
            }

            core.info(`Sensitive paths changed:\n${[...new Set(sensitiveFiles)].join('\n')}`);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const latestReviewStateByApprover = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login || !APPROVERS.includes(login.toLowerCase())) continue;
              if (review.state === 'COMMENTED' || review.state === 'PENDING') continue;
              latestReviewStateByApprover.set(login, review.state);
            }

            const approvedBy = [...latestReviewStateByApprover]
              .filter(([, state]) => state === 'APPROVED')
              .map(([login]) => login);

            if (approvedBy.length > 0) {
              await setStatus(pull.head.sha, 'success', `Approved by ${approvedBy.join(', ')}`);
            } else {
              await setStatus(pull.head.sha, 'failure', 'Sensitive paths changed: needs a maintainer approval');
            }
