name: CI Fork

# Slim, self-contained PR checks for SpeculativeTechnologies/CRM.
# The upstream twentyhq workflows (ci-front, ci-server, ...) assume paid
# 8-core runner labels and twentyhq-specific secrets, so they are disabled on
# this fork. The `ci-fork-status-check` job below is the single required
# status check for merging into main.
#
# push:main runs are near no-ops (affected base == HEAD) but populate the
# node_modules cache that all PR branches restore from.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-fork-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      # Without this every run recomputed from cold, rebuilding twenty-shared
      # and twenty-ui each time (~54s) and re-running tasks whose inputs had
      # not changed since the last push to the same branch. The actions were
      # already here, used by upstream's ci-front; this fork just never
      # called them.
      - name: Restore task cache
        id: task-cache
        uses: ./.github/actions/restore-cache
        with:
          key: ci-fork-checks
      - name: Resolve affected base
        run: echo "NX_BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Build shared packages
        run: npx nx run-many -t build -p twenty-shared twenty-ui
      - name: Typecheck affected
        run: npx nx affected --nxBail -t typecheck --parallel=2 --base=$NX_BASE
      - name: Lint affected
        run: npx nx affected --nxBail -t lint --parallel=2 --base=$NX_BASE
      # Excluded from the unit-test gate: twenty-front runs sharded in its own
      # job below; twenty-e2e-testing's `test` target is Playwright E2E and
      # needs a live app; website/zapier tests need their own upstream CI setup.
      - name: Unit-test affected (except twenty-front / e2e / website / zapier)
        run: npx nx affected --nxBail -t test --exclude=twenty-front,twenty-e2e-testing,twenty-website,twenty-zapier --parallel=1 --base=$NX_BASE
      # Adding a `t` or `<Trans>` string without re-extracting leaves the
      # catalogs with no entry for its generated id, and Lingui then renders
      # the id itself ("cKqT2J" where "View full record" belongs). Nothing
      # caught that before: upstream's ci-front runs these targets but this
      # fork does not use it, and the image used to extract at build time, so
      # staging looked right while a host-built production frontend did not.
      # Only for projects nx considers affected. Running all three
      # unconditionally cost ~102s on every PR, including ones that touched
      # nothing but deploy scripts. `nx show projects` prints a JSON array in
      # some contexts and one project per line in others, so the output is
      # normalised rather than grepped directly.
      - name: Extract and compile message catalogs
        run: |
          # An empty affected list is normal, not an error: it is every push:main
          # run (base == HEAD by design) and any PR touching no nx project. grep
          # exits 1 when it matches nothing, and under `bash -e` that failed the
          # step outright, which is what turned main red from 2026-08-01 01:54.
          affected="$(
            npx nx show projects --affected --base=$NX_BASE |
              tr -d '[]"' | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' || true
          )"
          for project in twenty-front twenty-server twenty-emails; do
            if printf '%s\n' "$affected" | grep -qx "$project"; then
              npx nx run "${project}:lingui:extract"
              npx nx run "${project}:lingui:compile"
            else
              echo "${project} is not affected; skipping catalog check"
            fi
          done
      - name: Fail if the catalogs were not committed up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Message catalogs are stale. For each project below run" \
              "'npx nx lingui:extract <project>' and 'npx nx lingui:compile <project>'," \
              "then commit the result."
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi
          echo "Message catalogs are up to date."
      - name: Save task cache
        if: always()
        uses: ./.github/actions/save-cache
        with:
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  # Each front-tests shard used to spend ~172s on checkout and install before
  # its own nx check told it there was nothing to do, three times over, on
  # every PR that touched no frontend code. This decides that up front from
  # the PR's file list alone: no checkout, no install, a few seconds.
  #
  # Deliberately one-directional. It only skips when every changed path is in
  # a set verified not to reach twenty-front (`nx show projects --affected
  # --files=...` reports twenty-front for twenty-front, twenty-shared,
  # twenty-ui and the root package.json, and not for these). Anything else,
  # including an unrecognised path or a non-PR event, runs the shards, where
  # the precise nx check still has the final say.
  front-scope:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-shards: ${{ steps.scope.outputs.run-shards }}
    steps:
      - name: Decide whether the frontend can be affected
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "Not a pull request; running the shards."
            echo "run-shards=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(
            gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
              --paginate --jq '.[].filename'
          )"

          if printf '%s\n' "$files" | grep -qvE \
            '^(deploy/|\.github/|packages/twenty-server/|packages/twenty-docker/)'; then
            echo "Changed paths can reach twenty-front; running the shards."
            echo "run-shards=true" >> "$GITHUB_OUTPUT"
          else
            echo "Every changed path is outside twenty-front's graph; skipping the shards."
            echo "run-shards=false" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$files"

  front-tests:
    needs: front-scope
    if: needs.front-scope.outputs.run-shards == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Restore task cache
        id: task-cache
        uses: ./.github/actions/restore-cache
        with:
          key: ci-fork-front-tests-${{ matrix.shard }}
      - name: Check whether twenty-front is affected
        id: front-affected
        run: |
          NX_BASE=$(git merge-base origin/main HEAD)
          if npx nx show projects --affected --base=$NX_BASE | grep -qx twenty-front; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build shared packages
        if: steps.front-affected.outputs.affected == 'true'
        run: npx nx run-many -t build -p twenty-shared twenty-ui
      - name: Front / Write .env
        if: steps.front-affected.outputs.affected == 'true'
        run: npx nx reset:env twenty-front
      # --coverage=false: each shard only runs 1/3 of the suite, so jest's
      # GLOBAL coverage thresholds always fail per-shard; correctness of the
      # tests is what gates here, not coverage.
      - name: Unit-test twenty-front (shard ${{ matrix.shard }}/3)
        if: steps.front-affected.outputs.affected == 'true'
        run: npx nx test twenty-front --shard=${{ matrix.shard }}/3 --coverage=false
      - name: Save task cache
        if: always()
        uses: ./.github/actions/save-cache
        with:
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  # Single stable name to mark as the required status check on main.
  # front-tests is skipped, not failed, when front-scope rules the frontend
  # out, and a skipped job does not match the failure check below.
  ci-fork-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [checks, front-scope, front-tests]
    steps:
      - name: Fail if any needed job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
