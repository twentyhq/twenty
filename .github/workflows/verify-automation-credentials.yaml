name: Verify protected automation credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        environment: [automation, release-dispatch]
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate read-only dispatcher token
        id: dispatcher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TWENTY_WORKFLOW_DISPATCHER_CLIENT_ID }}
          private-key: ${{ secrets.TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
          owner: twentyhq
          repositories: |
            twenty-infra
            twenty-factory
            ci-public
          permission-actions: read

      - name: Verify dispatcher repository access without running workflows
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
        run: |
          for repository in twenty-infra twenty-factory ci-public; do
            gh api "repos/twentyhq/$repository/actions/workflows" --jq '.total_count'
          done

      - name: Generate read-only PR App token
        if: matrix.environment == 'automation'
        id: pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TWENTY_PR_APP_ID }}
          private-key: ${{ secrets.TWENTY_PR_APP_PRIVATE_KEY }}
          owner: twentyhq
          repositories: twenty
          permission-contents: read
          permission-pull-requests: read

      - name: Verify PR App repository access
        if: matrix.environment == 'automation'
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
        run: gh api repos/twentyhq/twenty/pulls --jq 'length'

      - name: Verify remaining protected credentials
        if: matrix.environment == 'automation'
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os
          import urllib.request

          for name in ["CROWDIN_PERSONAL_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN", "ARTIFICIAL_ANALYSIS_API_KEY"]:
              if not os.environ[name]:
                  raise RuntimeError("Missing environment credential: " + name)
          request = urllib.request.Request(
              "https://twenty.api.crowdin.com/api/v2/user",
              headers={"Authorization": "Bearer " + os.environ["CROWDIN_PERSONAL_TOKEN"]},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 200
          print("Crowdin authentication succeeded; shared inference and catalog credentials are present")
          PYTHON
