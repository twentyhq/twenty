# Pull down website translations from Crowdin every two hours or when triggered manually.
# Schedule and workflow_dispatch always download. workflow_call downloads when
# force_pull is true. We cannot gate on `lingui compile --strict`: English is the
# fallback locale, so empty msgstr values compile successfully.

name: 'Pull website translations from Crowdin'

permissions:
  contents: write
  pull-requests: read

on:
  schedule:
    - cron: '0 */2 * * *' # Every two hours.
  workflow_dispatch:
  workflow_call:
    inputs:
      force_pull:
        description: 'Download translations even though the caller was not triggered by a schedule'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pull_website_translations:
    name: Pull website translations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pushed: ${{ steps.push_changes.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ github.token }}
          ref: ${{ github.head_ref || github.ref_name }}
          # Merging main into the i18n branch needs their shared history
          fetch-depth: 0
          filter: blob:none

      - name: Setup website i18n branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@twenty.com'
          # The branch only holds regenerable output, so restart it from main when
          # there is no open PR to keep or when keeping it would conflict with main
          if [ "$(gh pr list --head i18n-website --base main --state open --json number --jq length)" = 0 ]; then
            git checkout -B i18n-website origin/main
          else
            git checkout -B i18n-website origin/i18n-website
            git merge --no-edit origin/main || { git merge --abort && git checkout -B i18n-website origin/main; }
          fi

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Build twenty-shared
        run: npx nx build twenty-shared

      - name: Stash any changes before pulling translations
        run: |
          git add .
          git stash

      # Repair machine-translation damage in Crowdin before downloading, so the
      # catalogs that reach the repo are already correct rather than a cycle behind.
      - name: Normalize translations in Crowdin
        if: inputs.force_pull == true || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx tsx packages/twenty-utils/crowdin-normalizer/normalize-crowdin-translations.ts --project=4 --format=po --apply || echo "::warning::translation normalization failed (non-blocking)"
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Pull website translations from Crowdin
        if: inputs.force_pull == true || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          export_only_approved: false
          localization_branch_name: i18n-website
          base_url: 'https://twenty.api.crowdin.com'
          auto_approve_imported: false
          import_eq_suggestions: false
          download_sources: false
          push_sources: false
          skip_untranslated_strings: false
          skip_untranslated_files: false
          push_translations: false
          create_pull_request: false
          skip_ref_checkout: true
          dryrun_action: false
          config: '.github/crowdin-website.yml'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Website translations project
          CROWDIN_PROJECT_ID: '4'
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # As the files are extracted from a Docker container, they belong to root:root.
      # We need to fix this before the next steps.
      - name: Fix file permissions
        run: sudo chown -R runner:docker .

      - name: Normalize downloaded catalogs to lingui format
        run: npx nx run twenty-website:lingui:extract

      - name: Compile website translations
        id: compile_translations
        run: |
          npx nx run twenty-website:lingui:compile
          git status
          git add packages/twenty-website/src/locales
          if ! git diff --staged --quiet --exit-code; then
            git commit -m "chore: compile website translations"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        id: push_changes
        if: steps.compile_translations.outputs.changes_detected == 'true'
        run: git push --force-with-lease origin HEAD:i18n-website

  open_pull_request:
    name: Open website translations pull request
    needs: pull_website_translations
    if: needs.pull_website_translations.outputs.pushed == 'true'
    permissions: {}
    uses: ./.github/workflows/i18n-open-pull-request.yaml
    with:
      branch: i18n-website
      title: 'i18n - website translations'
    secrets:
      TWENTY_PR_PRIVATE_KEY: ${{ secrets.TWENTY_PR_PRIVATE_KEY }}
      TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY: ${{ secrets.TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
