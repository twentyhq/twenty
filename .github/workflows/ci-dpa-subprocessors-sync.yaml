name: DPA Sub-Processor Sync

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly, Monday at 6 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  sync-subprocessors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      SUBPROCESSORS_FILE: packages/twenty-server/src/engine/core-modules/dpa/constants/subprocessors.json
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Build dependencies
        run: npx nx build twenty-shared

      - name: Run sub-processor sync
        run: npx nx run twenty-server:ts-node-no-deps-transpile-only -- ./scripts/dpa-sync-subprocessors.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet "$SUBPROCESSORS_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sub-processors branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@twenty.com'
          git switch -c chore/dpa-subprocessors-sync
          git add "$SUBPROCESSORS_FILE"
          git commit -m 'chore: sync DPA sub-processors from trust center'
          git push --force origin chore/dpa-subprocessors-sync

  open-pull-request:
    needs: sync-subprocessors
    if: needs.sync-subprocessors.outputs.changed == 'true'
    permissions: {}
    uses: ./.github/workflows/open-pull-request.yaml
    with:
      branch: chore/dpa-subprocessors-sync
      title: 'chore: sync DPA sub-processors from trust center'
      body: |
        Automated weekly sync of `subprocessors.json` from Twenty's Trust Center (OneLeet).

        This keeps the DPA's Annex C (the SCC Annex III list of Sub-Processors) in
        lockstep with the canonical list at https://trust.twenty.com — the Trust
        Center is the single source of truth; this file is generated from it.

        **Please review before merging** — confirm the added/removed Sub-Processors
        are expected, and that customers were notified per Section 6.2 where required.
    secrets:
      TWENTY_PR_PRIVATE_KEY: ${{ secrets.TWENTY_PR_PRIVATE_KEY }}
      TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY: ${{ secrets.TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
