# Deploy a pinned image to the cloud staging or production box.
#
# Authenticates to Google Cloud with Workload Identity Federation, so no service
# account key exists anywhere. Every environment-specific identifier comes from
# repository variables rather than being written here, because this repository is
# public.
#
# Both target branches deploy automatically, so the cloud boxes track whatever the
# Mac is running during the parallel-run period. That is the point: every push
# rehearses the deploy and the schema upgrade before anyone depends on it.
#
# Production is still gated, but by the GitHub Environment rather than by the
# trigger: `environment: production` should have required reviewers, so a
# production deploy waits for a human even when a push started it. That keeps
# promotion a human decision without giving up the rehearsal.
#
# Parallel-run safety rests on two flags set on the cloud production box:
# CLOUD_DISABLE_CRON_JOBS=true and CLOUD_EMAIL_DRIVER=logger. Deploying code to
# both boxes is harmless while those hold, because the cloud box cannot sync
# mailboxes or send mail. When they flip at cutover, the Mac must already be
# quiesced.
name: cd-deploy-cloud

on:
  push:
    branches: [staging-target, production-target]
  workflow_dispatch:
    inputs:
      environment:
        description: Which box to deploy
        required: true
        type: choice
        options: [staging, production]
      sha:
        description: 40-character commit SHA to deploy (defaults to this ref)
        required: false
        type: string

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for federation

concurrency:
  # Never let two deploys race on the same box.
  group: cd-deploy-cloud-${{ github.event.inputs.environment || (github.ref_name == 'production-target' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'production-target' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: target
        run: |
          set -euo pipefail
          ENV_NAME="${{ github.event.inputs.environment || (github.ref_name == 'production-target' && 'production' || 'staging') }}"
          SHA="${{ github.event.inputs.sha || github.sha }}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a 40-char sha: $SHA"; exit 1; }
          if [ "$ENV_NAME" = "production" ]; then
            echo "vm=${{ vars.GCP_PRODUCTION_VM }}" >> "$GITHUB_OUTPUT"
          else
            echo "vm=${{ vars.GCP_STAGING_VM }}" >> "$GITHUB_OUTPUT"
          fi
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify the image exists before touching the box
        run: |
          set -euo pipefail
          TAG="ghcr.io/${{ github.repository_owner }}/twenty:${{ steps.target.outputs.sha }}"
          TOKEN=$(curl -sSf -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/twenty:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -sSfI -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/twenty/manifests/${{ steps.target.outputs.sha }}" >/dev/null
          echo "image present: $TAG"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Start the box if it is stopped
        run: |
          set -euo pipefail
          VM="${{ steps.target.outputs.vm }}"
          ZONE="${{ vars.GCP_ZONE }}"
          STATUS=$(gcloud compute instances describe "$VM" --zone "$ZONE" --format='value(status)')
          echo "$VM is $STATUS"
          if [ "$STATUS" != "RUNNING" ]; then
            gcloud compute instances start "$VM" --zone "$ZONE"
            # Containers return on their own (restart: unless-stopped); wait for
            # SSH rather than guessing at a sleep duration.
            for i in $(seq 1 30); do
              if gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
                   --command='true' 2>/dev/null; then echo "reachable"; break; fi
              echo "waiting for ssh ($i/30)"; sleep 10
            done
          fi

      - name: Deploy
        run: |
          set -euo pipefail
          gcloud compute ssh "${{ steps.target.outputs.vm }}" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            --command "sudo /opt/twenty/cloud-deploy.sh ${{ steps.target.outputs.sha }}"

      - name: Verify from outside
        run: |
          set -euo pipefail
          HOST="${{ steps.target.outputs.env_name == 'production' && vars.API_HOSTNAME_PRODUCTION || vars.API_HOSTNAME_STAGING }}"
          # The API hostname is service-token gated, so an unauthenticated probe
          # proving 403 confirms the tunnel is up AND the edge policy is intact.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://$HOST/healthz" --max-time 30)
          echo "$HOST unauthenticated -> $CODE"
          [ "$CODE" = "403" ] || { echo "expected 403 from Access"; exit 1; }

      - name: Stop staging again when idle
        # Production stays up. Staging costs ~$65/month running and ~$9 stopped,
        # so a deploy that wakes it should put it back.
        if: steps.target.outputs.env_name == 'staging' && vars.STAGING_STOP_AFTER_DEPLOY == 'true'
        run: |
          gcloud compute instances stop "${{ steps.target.outputs.vm }}" \
            --zone "${{ vars.GCP_ZONE }}" --async
